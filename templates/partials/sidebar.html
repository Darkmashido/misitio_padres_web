{% load static %}
<aside class="hidden h-full w-64 shrink-0 flex-col bg-indigo-900 text-white transition-all duration-300 lg:flex">
    <div class="flex items-center gap-2 p-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.7 2.15a1 1 0 0 1 .6 0l9.5 3a1 1 0 0 1 0 1.9l-3.05.96a3.5 3.5 0 0 1 .25 1.29v3.2a1 1 0 0 1-.29.7c-.86.86-2.6 2.1-6.06 2.1s-5.2-1.24-6.06-2.1a1 1 0 0 1-.29-.7v-3.2c0-.44.09-.87.25-1.3L2.5 7.05a1 1 0 0 1 0-1.9zM6.5 12.6v-2.53l4.9 1.55a1 1 0 0 0 .6 0l4.9-1.55v2.53c-.5.4-1.8 1.15-4.9 1.15s-4.4-.75-4.9-1.15z"/>
            <path d="M4 15.5a1 1 0 0 1 1 1V19c0 .3-.15.58-.4.76l-1.3 1a1 1 0 0 1-1.6-.76v-3.5a1 1 0 0 1 1-1z"/>
        </svg>
        <span class="text-2xl font-extrabold tracking-tight">EduPadres</span>
    </div>

    <nav class="mt-4 flex-1 space-y-2 px-4">
        <a
            href="{% url 'dashboard:index' %}"
            class="flex w-full items-center rounded-lg p-3 text-sm font-semibold transition
                {% if request.resolver_match.view_name == 'dashboard:index' %}bg-indigo-800 text-white{% else %}text-indigo-100 hover:bg-indigo-800{% endif %}"
        >
            <i class="fas fa-house mr-3 w-5 text-center text-indigo-300"></i>
            Inicio
        </a>

        <a
            href="{% url 'calendar:index' %}"
            class="flex w-full items-center rounded-lg p-3 text-sm font-semibold transition
                {% if request.resolver_match.view_name == 'calendar:index' %}bg-indigo-800 text-white{% else %}text-indigo-100 hover:bg-indigo-800{% endif %}"
        >
            <i class="fas fa-calendar-days mr-3 w-5 text-center text-indigo-300"></i>
            Agenda
        </a>

        <a
            href="{% url 'payments:index' %}"
            class="flex w-full items-center rounded-lg p-3 text-sm font-semibold transition
                {% if request.resolver_match.view_name == 'payments:index' %}bg-indigo-800 text-white{% else %}text-indigo-100 hover:bg-indigo-800{% endif %}"
        >
            <i class="fas fa-wallet mr-3 w-5 text-center text-indigo-300"></i>
            Pagos
        </a>

        <!--<a href="#" class="flex w-full items-center rounded-lg p-3 text-sm font-semibold text-indigo-100 transition hover:bg-indigo-800">
            <i class="fas fa-envelope mr-3 w-5 text-center text-indigo-300"></i>
            Mensajes
        </a>-->
    </nav>

    <form method="post" action="{% url 'authentication:logout' %}" class="border-t border-indigo-800 p-4">
        {% csrf_token %}
        <button type="submit" class="flex w-full items-center gap-2 rounded-lg p-3 text-sm font-semibold text-indigo-200 transition hover:bg-indigo-800 hover:text-white">
            <i class="fas fa-right-from-bracket"></i>
            Cerrar Sesión
        </button>
    </form>
</aside>
