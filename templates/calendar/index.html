{% extends "layout.html" %}

{% block title %}Agenda - Mi Sitio Padres{% endblock %}

{% block body %}
<div class="mx-auto max-w-4xl space-y-6 px-4 py-6 sm:px-6">
        <div id="student-selector" class="flex gap-4">
            {% for student in students %}
                <button type="button" data-student="{{ student.id }}" data-name="{{ student.nombre }}" class="group flex flex-col items-center gap-1 opacity-60 transition aria-pressed:opacity-100" aria-pressed="{% if forloop.first %}true{% else %}false{% endif %}">
                    {% if student.image_url %}
                        <img src="{{ student.image_url }}" alt="{{ student.nombre }}" class="h-14 w-14 rounded-full border-2 border-transparent object-cover group-aria-pressed:border-indigo-500">
                    {% else %}
                        <span class="flex h-14 w-14 items-center justify-center rounded-full border-2 border-transparent bg-pink-100 font-bold text-pink-600 group-aria-pressed:border-pink-500">{{ student.nombre|slice:":1" }}</span>
                    {% endif %}
                    <span class="text-xs font-bold text-gray-600 group-aria-pressed:text-indigo-600">{{ student.nombre|truncatewords:1 }}</span>
                </button>
            {% endfor %}
        </div>

        <section class="rounded-3xl bg-white p-4 shadow-sm sm:p-6">
            <div id="calendar"></div>
        </section>

        <div id="category-filters" class="flex flex-wrap gap-2">
            {% for key, cat in categories.items %}
                <button type="button" data-category="{{ key }}" aria-pressed="true" class="flex items-center gap-2 rounded-full bg-white px-4 py-2 text-xs font-bold text-gray-600 shadow-sm aria-pressed:bg-blue-600 aria-pressed:text-white">
                    <i class="fas {{ cat.icon }}"></i>{{ cat.label }}
                </button>
            {% endfor %}
        </div>

        <section>
            <div class="mb-3 flex items-center justify-between">
                <h2 id="day-title" class="text-lg font-bold text-gray-800"></h2>
                <span id="day-count" class="text-xs font-semibold text-gray-400"></span>
            </div>
            <div id="day-events" class="space-y-3"></div>
        </section>
</div>

<style>
    #calendar .fc-toolbar-title { font-size: 1rem; font-weight: 700; color: #000; }
    #calendar .fc-button,
    #calendar .fc-button:hover,
    #calendar .fc-button:focus,
    #calendar .fc-button:active,
    #calendar .fc-button-primary:not(:disabled):active {
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
        color: #6b7280;
        padding: 0.25rem 0.5rem;
    }
    #calendar .fc-button:hover { color: #111827; }
    #calendar .fc-icon { font-size: 1.5rem; }
</style>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales/es.global.min.js"></script>
{{ categories|json_script:"categories-data" }}
<script>
(function () {
    var eventsUrl = "{% url 'calendar:events' %}";
    var categories = JSON.parse(document.getElementById("categories-data").textContent);
    var studentButtons = document.querySelectorAll("[data-student]");
    var filterButtons = document.querySelectorAll("[data-category]");
    var dayTitle = document.getElementById("day-title");
    var dayCount = document.getElementById("day-count");
    var dayEvents = document.getElementById("day-events");

    var studentId = studentButtons.length ? studentButtons[0].dataset.student : null;
    var selectedDate = new Date();
    var loaded = [];

    function activeTypes() {
        return Array.prototype.filter.call(filterButtons, function (b) {
            return b.getAttribute("aria-pressed") === "true";
        }).map(function (b) { return b.dataset.category; });
    }

    function sameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }

    function pad(n) { return (n < 10 ? "0" : "") + n; }

    function renderDay() {
        var today = sameDay(selectedDate, new Date());
        var label = selectedDate.toLocaleDateString("es", { day: "numeric", month: "short" });
        dayTitle.textContent = (today ? "Hoy, " : "") + label;

        var items = loaded.filter(function (e) { return sameDay(e.start, selectedDate); });
        dayCount.textContent = items.length + (items.length === 1 ? " Evento" : " Eventos");
        dayEvents.replaceChildren();

        if (!items.length) {
            var empty = document.createElement("p");
            empty.className = "rounded-xl bg-white p-4 text-sm text-gray-400";
            empty.textContent = "No hay eventos para este dia.";
            dayEvents.appendChild(empty);
            return;
        }

        items.forEach(function (e) {
            var cat = categories[e.extendedProps.categoria] || {};
            var card = document.createElement("div");
            card.className = "flex items-center gap-4 rounded-xl border-l-4 bg-white p-4 shadow-sm";
            card.style.borderLeftColor = e.backgroundColor;

            var icon = document.createElement("span");
            icon.className = "flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-gray-100 text-gray-500";
            icon.innerHTML = '<i class="fas ' + (cat.icon || "fa-calendar") + '"></i>';

            var info = document.createElement("div");
            info.className = "min-w-0 flex-1";
            var title = document.createElement("p");
            title.className = "text-sm font-bold text-gray-800";
            title.textContent = e.title;
            var meta = document.createElement("p");
            meta.className = "text-[11px] text-gray-400";
            meta.textContent = pad(e.start.getHours()) + ":" + pad(e.start.getMinutes()) +
                (e.extendedProps.lugar ? " \u2022 " + e.extendedProps.lugar : "");
            info.append(title, meta);

            var owner = document.createElement("span");
            owner.className = "text-[10px] font-bold uppercase text-blue-600";
            owner.textContent = e.extendedProps.alumno;

            card.append(icon, info, owner);
            dayEvents.appendChild(card);
        });
    }

    var calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
        locale: "es",
        initialView: "dayGridMonth",
        height: "auto",
        firstDay: 0,
        headerToolbar: { left: "prev", center: "title", right: "next" },
        displayEventTime: true,
        eventTimeFormat: { hour: "numeric", minute: "2-digit", hour12: false },
        dateClick: function (info) { selectedDate = info.date; renderDay(); },
        eventClick: function (info) { selectedDate = info.event.start; renderDay(); },
        events: function (info, success, failure) {
            if (!studentId) { success([]); return; }
            var params = new URLSearchParams({
                student: studentId,
                types: activeTypes().join(","),
                start: info.startStr,
                end: info.endStr
            });
            fetch(eventsUrl + "?" + params.toString())
                .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(function (data) { success(data); })
                .catch(failure);
        },
        eventsSet: function (events) {
            loaded = events;
            renderDay();
        }
    });
    calendar.render();

    studentButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
            studentButtons.forEach(function (b) { b.setAttribute("aria-pressed", "false"); });
            btn.setAttribute("aria-pressed", "true");
            studentId = btn.dataset.student;
            calendar.refetchEvents();
        });
    });
    filterButtons.forEach(function (btn) {
        btn.addEventListener("click", function () {
            btn.setAttribute("aria-pressed", btn.getAttribute("aria-pressed") === "true" ? "false" : "true");
            calendar.refetchEvents();
        });
    });
})();
</script>
{% endblock %}
